name: Build libvirt images

# Builds libvirt/KVM guest disks for EVERY virtual-machine image the
# upstream server publishes that qualifies: variant=cloud (cloud-init),
# Incus VM disk available, x86_64. Discovery works exactly like the
# Incus container pipeline — the images: remote catalog is queried at
# run time, so upstream additions and removals track automatically.
#
# Each disk gets qemu-guest-agent installed and enabled, which is the
# channel Nova's libvirt driver uses for the admin-password API
# (openstack server set --password); the push script advertises it with
# hw_qemu_guest_agent=yes. The upstream disks boot UEFI, advertised
# with hw_firmware_type=uefi.
#
# Artifacts per image: <name>.qcow2 + <name>.manifest.json. Every run
# publishes a GitHub release (assets uploaded by each build job — the
# full set exceeds a single runner's disk). Pushing to Glance is a
# separate opt-in job; see README.

on:
  schedule:
    - cron: '0 2 1 * *'
  workflow_dispatch:
    inputs:
      push_to_glance:
        description: 'Push to Glance (needs OS_* secrets + reachable endpoint)'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: build-libvirt-guest-images
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.gen.outputs.matrix }}
      total: ${{ steps.gen.outputs.total }}
    steps:
      - name: Install Incus and build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends incus jq
          sudo incus admin init --preseed <<'EOF'
          networks: []
          storage_pools: []
          EOF

      - name: Generate image matrix from the images remote
        id: gen
        # Explicit bash shell for pipefail: the default runner shell
        # swallows mid-pipeline jq failures.
        shell: bash
        run: |
          sudo incus image list images: --format json > catalog.json

          # One alias per image: prefer the codename alias over the
          # numeric alias of the same disk.
          jq -r '.[]
              | select(.type == "virtual-machine"
                       and .architecture == "x86_64")
              | ((.aliases // []) | map(.name)
                 | map(select(test("^[a-z0-9]+/[^/]+/cloud$")))) as $names
              | select(($names | length) > 0)
              | ($names
                 | map(select(test("^[a-z0-9]+/[0-9.]+/cloud$") | not)))
                as $codenames
              | if ($codenames | length) > 0
                then $codenames[0] else $names[0] end' catalog.json \
            | sort -u > aliases.txt

          matrix='[]'
          add() {
            matrix=$(jq --arg n "$1" --arg s "$2" --arg p "$3" \
              '. + [{name:$n, source:$s, pre_command:$p}]' <<<"$matrix")
          }

          while read -r alias; do
            os=${alias%%/*}
            rest=${alias#*/}
            release=${rest%%/*}
            case "$os" in
              ubuntu|debian|almalinux|rockylinux|centos|fedora|openeuler|opensuse|alpine)
                pre="" ;;
              archlinux)
                # pacman refuses to install until the keyring exists.
                pre="pacman-key --init && pacman-key --populate archlinux" ;;
              *)
                echo "SKIP $alias: no rule for distro '$os'" >&2
                continue ;;
            esac
            release_slug=$(tr '[:upper:]' '[:lower:]' <<<"$release")
            add "${os}-${release_slug}-cloud-kvm" "images:$alias" "$pre"
          done < aliases.txt

          total=$(jq length <<<"$matrix")
          ((total > 0)) || { echo "empty matrix" >&2; exit 1; }
          {
            echo "## Discovered $total buildable VM images"
            jq -r '.[] | "- \(.source) -> \(.name)"' <<<"$matrix"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "matrix=$(jq -c . <<<"$matrix")" >> "$GITHUB_OUTPUT"
          echo "total=$total" >> "$GITHUB_OUTPUT"

  prepare:
    needs: discover
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Create draft release
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="libvirt-images-$(date -u +%Y%m%d)-${{ github.run_number }}"
          gh release create "$tag" --draft \
            --title "libvirt guest images $tag" \
            --notes "Build in progress."
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  build:
    needs: [discover, prepare]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.discover.outputs.matrix) }}
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Install Incus and build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            incus qemu-utils jq file
          sudo incus admin init --preseed <<'EOF'
          networks: []
          storage_pools:
          - name: default
            driver: dir
          profiles:
          - name: default
            devices:
              root:
                type: disk
                path: /
                pool: default
          EOF

      - name: Build VM image
        run: |
          sudo env \
            SOURCE='${{ matrix.source }}' \
            IMAGE_NAME='${{ matrix.name }}' \
            PRE_COMMAND='${{ matrix.pre_command }}' \
            OUTPUT_DIR="$PWD/dist" \
            bash libvirt/build-vm-image.sh

      - name: Validate artifacts
        run: |
          set -eux
          sudo chown -R "$(id -u):$(id -g)" dist
          qemu-img check "dist/${{ matrix.name }}.qcow2"
          jq -e '.qemu_guest_agent == true' \
            "dist/${{ matrix.name }}.manifest.json"
          jq . "dist/${{ matrix.name }}.manifest.json"

      - name: Checksum
        run: |
          cd dist
          sha256sum "${{ matrix.name }}.qcow2" > "${{ matrix.name }}.sha256"

      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release upload '${{ needs.prepare.outputs.tag }}' \
            "dist/${{ matrix.name }}.qcow2" \
            "dist/${{ matrix.name }}.manifest.json"

      - name: Upload metadata artifact
        uses: actions/upload-artifact@v4
        with:
          name: meta-libvirt-${{ matrix.name }}
          path: |
            dist/*.manifest.json
            dist/*.sha256
          retention-days: 14
          if-no-files-found: error

  finalize-release:
    # Publish whatever subset built successfully; individual distro
    # failures must not block the rest of the fleet.
    needs: [discover, prepare, build]
    if: ${{ !cancelled() && needs.prepare.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download metadata artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: meta-libvirt-*
          path: dist
          merge-multiple: true

      - name: Finalize release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.prepare.outputs.tag }}
          TOTAL: ${{ needs.discover.outputs.total }}
        run: |
          cd dist
          built=$(ls -- *.manifest.json | wc -l)
          cat -- *.sha256 | sort -k2 > SHA256SUMS
          {
            echo "Built $built of $TOTAL discovered VM images."
            echo
            echo "| Image | Source | Serial | qemu-guest-agent |"
            echo "|---|---|---|---|"
            for m in *.manifest.json; do
              jq -r '"| \(.name) | \(.source_alias) | \(.source_serial) | \(.qemu_guest_agent) |"' "$m"
            done
            echo
            echo "Push to Glance with \`libvirt/push-to-glance.sh\`;"
            echo "see README."
          } > notes.md
          gh release upload "$TAG" SHA256SUMS
          gh release edit "$TAG" --draft=false --notes-file notes.md

  push-to-glance:
    # Off by default: GitHub-hosted runners cannot reach a private
    # OpenStack endpoint. Enable via the PUSH_TO_GLANCE repo variable
    # plus GLANCE_RUNNER, or per-run via the workflow_dispatch input.
    if: >-
      ${{ !cancelled() &&
          (vars.PUSH_TO_GLANCE == 'true' ||
           (github.event_name == 'workflow_dispatch' &&
            inputs.push_to_glance)) }}
    needs: [discover, prepare, build]
    runs-on: ${{ vars.GLANCE_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 120
    env:
      OS_AUTH_URL: ${{ secrets.OS_AUTH_URL }}
      OS_PROJECT_NAME: ${{ secrets.OS_PROJECT_NAME }}
      OS_PROJECT_DOMAIN_NAME: ${{ secrets.OS_PROJECT_DOMAIN_NAME }}
      OS_USERNAME: ${{ secrets.OS_USERNAME }}
      OS_USER_DOMAIN_NAME: ${{ secrets.OS_USER_DOMAIN_NAME }}
      OS_PASSWORD: ${{ secrets.OS_PASSWORD }}
      OS_REGION_NAME: ${{ secrets.OS_REGION_NAME }}
      OS_IDENTITY_API_VERSION: '3'
      IMAGE_STORE: ${{ vars.GLANCE_IMAGE_STORE }}
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Download release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release download '${{ needs.prepare.outputs.tag }}' \
            --dir dist

      - name: Install OpenStack CLI
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install python-openstackclient
          sudo apt-get install -y --no-install-recommends jq || true

      - name: Push images to Glance
        run: bash libvirt/push-to-glance.sh dist
